name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  # .sqlx/ is checked in, so sqlx macros validate against the offline cache
  # instead of needing a live DATABASE_URL.
  SQLX_OFFLINE: "true"
  # Keep in sync with .env.example / Dockerfile.dev.
  CARGO_LEPTOS_VERSION: "0.3.6"

jobs:
  build:

    runs-on: ubuntu-latest

    # The database-backed authorization tests use `#[sqlx::test]`, which creates
    # and drops a per-test database. Postgres 18 for `uuidv7()`, matching
    # compose.yaml. These credentials are throwaway values for this runner's
    # service container only.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: finall
          POSTGRES_PASSWORD: finall
          POSTGRES_DB: finall
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://finall:finall@localhost:5432/finall

    steps:
    - uses: actions/checkout@v4

    - name: Add wasm32 target and components
      run: |
        rustup target add wasm32-unknown-unknown
        rustup component add clippy rustfmt

    - name: Install cargo-leptos
      run: |
        curl \
          --proto '=https' \
          --tlsv1.2 \
          -LsSf \
          "https://github.com/leptos-rs/cargo-leptos/releases/download/v${CARGO_LEPTOS_VERSION}/cargo-leptos-installer.sh" \
        | sh

    - name: Install sqlfluff
      run: pip install sqlfluff

    - name: cargo fmt --check
      run: cargo fmt --check

    - name: clippy (ssr)
      run: cargo clippy --features ssr
    - name: clippy (hydrate)
      run: cargo clippy --features hydrate --target wasm32-unknown-unknown

    - name: check (ssr)
      run: cargo check --features ssr
    - name: check (hydrate)
      run: cargo check --features hydrate --target wasm32-unknown-unknown

    - name: sqlfluff lint
      run: sqlfluff lint migrations/

    - name: cargo leptos test
      run: cargo leptos test

    # Runs the database-backed tests, which `cargo leptos test` does not reach.
    # Compilation still resolves the sqlx macros from .sqlx/ (SQLX_OFFLINE);
    # DATABASE_URL is needed at run time only.
    - name: cargo test (ssr)
      run: cargo test --features ssr
