services:
  db:
    image: postgres:18-trixie
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-my_app}
      POSTGRES_USER: ${POSTGRES_USER:-my_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: ${APP_NAME:-my-app}
        CARGO_LEPTOS_VERSION: ${CARGO_LEPTOS_VERSION:-0.3.6}
    environment:
      DATABASE_URL: >-
        postgres://${POSTGRES_USER:-my_app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-my_app}
      LEPTOS_OUTPUT_NAME: ${APP_NAME:-my-app}
      LEPTOS_SITE_ADDR: 0.0.0.0:8080
      LEPTOS_SITE_ROOT: /app/site
      LEPTOS_SITE_PKG_DIR: pkg
      LEPTOS_ENV: PROD
      RUST_LOG: ${RUST_LOG:-info}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-0}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "http://127.0.0.1:8080/health"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64M,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend
      - web

volumes:
  postgres_data:

networks:
  backend:
    internal: true

  web:
